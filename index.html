<!DOCTYPE html>
<html lang="th" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0B1030">
<title>ระบบแก้ 0/ร</title>
<style>
:root{
  --bg:#0B1030; --bg2:#141A45; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.13); --text:#EEF1FF; --muted:#A3AAD0; --ink:#EEF1FF; --ink-soft:#C3C8E6;
  --pen:#FF4D63; --pen-soft:rgba(255,77,99,.16); --pass:#2EE59D; --pass-soft:rgba(46,229,157,.14);
  --gold:#FFC940; --violet:#7C6CFF; --hl:#FFC940; --tick:rgba(255,255,255,.12);
  --font:"Sarabun","Leelawadee UI","Thonburi","Noto Sans Thai","Segoe UI",system-ui,sans-serif;
  --r-sheet:22px; --r-ctl:14px;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--text);font-size:17px;line-height:1.6;background:radial-gradient(1200px 700px at 50% -10%,#232B6B 0%,var(--bg) 60%) fixed,var(--bg);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.33;pointer-events:none}
body::before{background:var(--pen);top:-25vmax;left:-20vmax;animation:drift1 22s ease-in-out infinite alternate}
body::after{background:var(--pass);bottom:-30vmax;right:-20vmax;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,10vmax)}}
@keyframes drift2{to{transform:translate(-12vmax,-8vmax)}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px}
.hidden{display:none!important}
.sheet{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--r-sheet);padding:26px 24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
h1,h2,h3{line-height:1.2;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.btn{position:relative;border:0;background:linear-gradient(135deg,var(--violet),#4D8BFF);color:#fff;border-radius:var(--r-ctl);padding:11px 22px;font-weight:800;min-height:48px;box-shadow:0 10px 24px -10px rgba(124,108,255,.9),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn.pen{background:linear-gradient(135deg,var(--pen),#FF8A3D);box-shadow:0 10px 24px -10px rgba(255,77,99,.9)}
.btn.small{min-height:38px;padding:6px 14px;font-size:15px}

/* ---------- hero ---------- */
.mark{position:relative;display:flex;align-items:center;gap:26px;margin:4px 0 22px;padding:26px 26px;border-radius:28px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(120deg,rgba(255,77,99,.18),rgba(124,108,255,.14) 50%,rgba(46,229,157,.16));box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.mark::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 3.2s 1s ease-in-out}
@keyframes sheen{to{transform:translateX(100%)}}
.grade{position:relative;flex:none;font-weight:900;font-size:86px;line-height:1;letter-spacing:-3px;padding:0 6px;
  background:linear-gradient(180deg,#FF8A9A,var(--pen));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 24px rgba(255,77,99,.55))}
.grade svg{position:absolute;left:-2px;top:-6px;width:calc(100% + 4px);height:calc(100% + 12px);overflow:visible}
.grade path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:strike .6s .4s cubic-bezier(.6,0,.3,1) forwards;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
@keyframes strike{to{stroke-dashoffset:0}}
.mark h1{font-size:34px;font-weight:900;background:linear-gradient(90deg,#fff,#C9CEFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}
.mark .htext{flex:1;min-width:0}
.stamp{position:absolute;right:-26px;top:-18px;transform:rotate(-14deg) scale(0);font-size:22px;font-weight:900;padding:2px 12px;border-radius:10px;border:3px solid var(--pass);color:var(--pass);background:rgba(11,16,48,.85);-webkit-text-fill-color:var(--pass);letter-spacing:0;box-shadow:0 0 24px rgba(46,229,157,.6);animation:stampIn .5s 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{to{transform:rotate(-14deg) scale(1)}}
.bigring{flex:none;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:conic-gradient(var(--pass) calc(var(--p)*1%),rgba(255,255,255,.1) 0);box-shadow:0 0 40px rgba(46,229,157,calc(var(--p)*.006))}
.bigring>div{width:88px;height:88px;border-radius:50%;background:var(--bg2);display:grid;place-content:center;line-height:1.1}
.bigring b{font-size:30px;font-weight:900}.bigring small{font-size:12px;color:var(--muted)}

/* ---------- register ---------- */
.form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--ink-soft)}
input,select{width:100%;border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px 14px;background:rgba(255,255,255,.07);min-height:50px;color:var(--text);transition:border-color .15s,box-shadow .15s}
select option{color:#111}
input::placeholder{color:rgba(255,255,255,.35)}
input:focus,select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,108,255,.25)}
.err{color:#FF8A9A;font-weight:700;min-height:1.4em;font-size:15px}
.note{border:1px solid rgba(255,201,64,.35);background:rgba(255,201,64,.1);padding:12px 16px;border-radius:14px;font-size:15px;color:#FFE3A1}

/* ---------- hub ---------- */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;margin-bottom:16px;color:var(--ink-soft)}
.who b{font-size:18px;color:var(--text)}
.sync{font-size:13px;color:var(--muted)}
.sync.bad{color:#FF8A9A}
.ledger{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.topic{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r-sheet);padding:18px 18px 16px;transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.topic:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.25);box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.topic.passed{border-color:rgba(46,229,157,.5);box-shadow:0 0 0 1px rgba(46,229,157,.2),0 20px 50px -25px rgba(46,229,157,.6)}
.topic.passed::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 120px at 0 0,rgba(46,229,157,.14),transparent);pointer-events:none}
.t-head{display:flex;gap:14px;align-items:center}
.t-head .tt{flex:1;min-width:0}
.t-head h3{font-size:19px;font-weight:800}
.t-head p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.tring{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.tring span{width:46px;height:46px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:13px;font-weight:900}
.pill{flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid currentColor}
.pill.ok{color:var(--pass);background:var(--pass-soft)}
.pill.no{color:#FF8A9A;background:var(--pen-soft)}
.pill.wait{color:var(--muted)}
.ticks{display:grid;grid-template-columns:repeat(50,1fr);gap:2px;margin:14px 0 12px;height:10px}
.ticks i{background:var(--tick);border-radius:3px}
.ticks i.y{background:var(--pass);box-shadow:0 0 6px rgba(46,229,157,.7)} .ticks i.n{background:var(--pen);box-shadow:0 0 6px rgba(255,77,99,.6)}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.t-foot .stats span{margin-right:12px}

/* ---------- quiz ---------- */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:15px;color:var(--ink-soft)}
.qbar .count{font-weight:900;font-variant-numeric:tabular-nums;font-size:18px;color:var(--text)}
.qbar .right{display:flex;gap:8px;align-items:center}
.streak{font-weight:900;color:var(--gold);background:rgba(255,201,64,.12);border:1px solid rgba(255,201,64,.4);border-radius:999px;padding:1px 10px;animation:pop .35s}
.qcard{margin-top:10px;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.lvl{display:inline-block;font-size:12px;font-weight:900;border-radius:999px;padding:2px 12px;margin-bottom:12px}
.lvl.l1{background:rgba(77,139,255,.18);color:#8FB5FF}.lvl.l2{background:rgba(255,201,64,.16);color:var(--gold)}.lvl.l3{background:var(--pen-soft);color:#FF8A9A}
.q{font-size:23px;font-weight:700;margin:0 0 20px;overflow-wrap:anywhere;line-height:1.45}
.q u{text-decoration:none;background:linear-gradient(transparent 55%,rgba(255,201,64,.55) 0);padding:0 3px;color:#fff}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-height:58px;font-size:17px;color:var(--text);transition:transform .15s,border-color .15s,background .15s}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:900;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--violet);background:rgba(124,108,255,.14);transform:translateX(4px)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.5}
.opt.right{border-color:var(--pass);background:var(--pass-soft);box-shadow:0 0 0 1px var(--pass),0 0 30px -6px rgba(46,229,157,.7);animation:pop .4s}
.opt.right .k{background:var(--pass);color:#062B1B}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft);animation:shake .4s}
.opt.wrong .k{background:var(--pen);color:#fff}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin-top:18px;border-radius:16px;padding:14px 16px;background:rgba(255,77,99,.1);border:1px solid rgba(255,77,99,.35);animation:rise .3s}
.fb.good{background:rgba(46,229,157,.1);border-color:rgba(46,229,157,.35)}
.fb b{display:block;margin-bottom:4px;font-size:17px}
.fb .good-t{color:var(--pass)} .fb .bad-t{color:#FF8A9A}
.nextbar{margin-top:18px;display:flex;justify-content:flex-end}

/* ---------- result ---------- */
.resultTop{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.scorering{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0);box-shadow:0 0 60px -10px var(--c);flex:none}
.scorering>div{width:140px;height:140px;border-radius:50%;background:var(--bg2);display:grid;place-content:center;text-align:center}
.score{font-size:52px;font-weight:900;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.review{margin-top:18px;display:grid;gap:10px}
.rv{border:1px solid var(--line);border-left:4px solid var(--pen);background:rgba(255,255,255,.04);padding:10px 14px;border-radius:12px;font-size:15px}
.rv .yours{color:#FF8A9A;text-decoration:line-through}
.rv .ans{color:var(--pass);font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* ---------- locked ---------- */
.lock h2{color:#FF8A9A;font-size:26px;margin-bottom:8px}

/* ---------- admin ---------- */
.adm .wrap{max-width:1200px}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{width:auto;min-height:42px;padding:6px 12px}
.tablebox{overflow-x:auto;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-sheet)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:980px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:rgba(20,26,69,.95);position:sticky;top:0;font-size:13px;color:var(--muted)}
tbody tr:hover{background:rgba(255,255,255,.04)}
td.c{text-align:center}
.cell{display:inline-block;min-width:56px;text-align:center;border-radius:8px;padding:2px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--pass-soft);color:var(--pass)} .cell.no{background:var(--pen-soft);color:#FF8A9A} .cell.none{color:var(--muted);font-weight:400}
.cell small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.dev{font-size:12px} .dev.on{color:var(--pass)} .dev.off{color:var(--muted)}
.viol{color:#FF8A9A;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:rgba(20,26,69,.95);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:50;max-width:92vw;box-shadow:0 20px 40px -10px rgba(0,0,0,.7);backdrop-filter:blur(10px)}
@media (max-width:620px){
  .mark{flex-wrap:wrap;gap:14px;padding:20px}
  .grade{font-size:60px}.mark h1{font-size:26px}
  .bigring{width:92px;height:92px}.bigring>div{width:72px;height:72px}.bigring b{font-size:24px}
  .ledger{grid-template-columns:1fr}
  .row3{grid-template-columns:1fr 1fr}
  .q{font-size:19px}
  .sheet{padding:20px 16px}
  .scorering{width:140px;height:140px}.scorering>div{width:114px;height:114px}.score{font-size:42px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.grade path{stroke-dashoffset:0}.stamp{transform:rotate(-14deg) scale(1)}.mark::after{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script>
/* =================== ตั้งค่า =================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwyerRUi5Po9RJlOtw67ZenqVNg1F0oBptVjEkAUlNlUModXdedsL1pxuDUafmGrrYStw/exec';          // วาง URL ของ Google Apps Script Web App ที่นี่ (เว้นว่าง = โหมดออฟไลน์)
const PASS_PERCENT_DEFAULT = 60; // เกณฑ์ผ่านต่อด่าน (%) — ถ้าเชื่อม GAS แล้วจะใช้ค่าจาก Code.gs
const ROOMS = 4;             // จำนวนห้องต่อชั้น
const MAX_NO = 50;           // เลขที่สูงสุด
const ADMIN_PIN_OFFLINE = '7846'; // ใช้เฉพาะตอนยังไม่มี GAS_URL
/* ============================================== */

const BANK = {"m4-1":[{"l":1,"q":"Which word is an adverb of manner? \"The old man walked slowly to the bus stop.\"","a":"slowly","d":["walked","old","stop"]},{"l":1,"q":"Which word is an adverb of manner? \"The children played happily in the garden.\"","a":"happily","d":["played","children","garden"]},{"l":1,"q":"Which word is an adverb of manner? \"Tom answered the difficult question correctly.\"","a":"correctly","d":["answered","difficult","question"]},{"l":1,"q":"Which word is an adverb of manner? \"My sister dances gracefully on the stage.\"","a":"gracefully","d":["dances","sister","stage"]},{"l":1,"q":"Which word is an adverb of manner? \"The students listened carefully to the teacher.\"","a":"carefully","d":["listened","students","teacher"]},{"l":1,"q":"Which word is an adverb of manner? \"He shouted angrily at the noisy dog.\"","a":"angrily","d":["shouted","noisy","dog"]},{"l":1,"q":"Which word is an adverb of manner? \"Please close the heavy door quietly.\"","a":"quietly","d":["close","heavy","door"]},{"l":1,"q":"Which word is an adverb of manner? \"The girl answered the phone politely.\"","a":"politely","d":["answered","girl","phone"]},{"l":1,"q":"The baby is sleeping ___ in her bed.","a":"peacefully","d":["peaceful","peace","peacefulness"]},{"l":1,"q":"The athlete ran ___ and won the race.","a":"quickly","d":["quick","quickness","quicken"]},{"l":1,"q":"The cat moved ___ towards the bird.","a":"silently","d":["silent","silence","silenced"]},{"l":1,"q":"Adverbs of manner answer which question?","a":"How?","d":["Where?","When?","How often?"]},{"l":1,"q":"What type of adverb is the underlined word? \"She finished her homework *quickly*.\"","a":"Adverb of manner","d":["Adverb of time","Adverb of place","Adverb of frequency"]},{"l":1,"q":"What type of adverb is the underlined word? \"The team played *badly* yesterday.\"","a":"Adverb of manner","d":["Adverb of time","Adverb of degree","Adverb of place"]},{"l":2,"q":"Which word is an adverb (not an adjective)?"," function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtQ(s){return esc(s).replace(/\*([^*]+)\*/g,'<u>$1</u>')}
function hash(str){let h1=0xdeadbeef^0,h2=0x41c6ce57^0;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0)*4294967296+(h1>>>0)}
function rng(seedStr){let a=hash(seedStr)%4294967296;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seedStr){const a=arr.slice(),r=rng(seedStr);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normName(s){return String(s||'').replace(/^(นางสาว|นาย|นาง|เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.|ดช\.|ดญ\.)\s*/,'').replace(/\s+/g,' ').trim().toLowerCase()}
let toastT; function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),ms||2600)}

/* ---------- sound ---------- */
let AC=null;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const now=AC.currentTime;const notes=ok?[660,880]:[220,180];notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,now+i*.09);g.gain.exponentialRampToValueAtTime(ok?.18:.08,now+i*.09+.01);g.gain.exponentialRampToValueAtTime(0.0001,now+i*.09+.16);o.connect(g).connect(AC.destination);o.start(now+i*.09);o.stop(now+i*.09+.18)})}catch(e){}}

let S=null;
function load(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&s.user)return s}catch(e){}return null}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
let PASS_PERCENT=PASS_PERCENT_DEFAULT;

/* ---------- backend ---------- */
async function gas(payload,timeoutMs){
  if(!GAS_URL) return {ok:false,error:'offline'};
  const ctrl=('AbortController' in window)?new AbortController():null;
  const tm=setTimeout(()=>ctrl&&ctrl.abort(),timeoutMs||20000);
  try{
    const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctrl?ctrl.signal:undefined});
    const j=await r.json(); return j&&typeof j==='object'?j:{ok:false,error:'bad_response'};
  }catch(e){return {ok:false,error:'network'}}
  finally{clearTimeout(tm)}
}

/* ---------- topic state ---------- */
function T(id){S.topics[id]=S.topics[id]||{best:0,attempts:0,last:null,run:null};return S.topics[id]}
function topicSummary(){const out={};Object.keys(S.topics).forEach(id=>{const t=S.topics[id];const r=t.run;out[id]={best:t.best,last:t.last,attempts:t.attempts,answered:r&&!r.done?r.answers.length:0,correct:r&&!r.done?r.correct:0}});return out}
function isPass(best,total){return total>0&&best*100/total>=PASS_PERCENT}
function questionOf(id,run,pos){
  const item=BANK[id][run.order[pos]];
  let opts=[item.a].concat(item.d);
  const sortable=opts.every(o=>/^[a-dA-D0-9]$/.test(o.trim()));
  opts=sortable?opts.slice().sort():shuffle(opts,S.user.key+'|'+id+'|'+run.attempt+'|q'+run.order[pos]);
  return {item,opts,sortable};
}

/* ---------- sync ---------- */
let syncing=false, syncAgain=false, syncState='';
async function sync(){
  if(!GAS_URL||!S||!S.user) return;
  if(syncing){syncAgain=true;return}
  syncing=true; setSync('กำลังบันทึก…');
  const res=await gas({action:'save',key:S.user.key,deviceId:DEVICE_ID,violations:S.violations||0,topics:topicSummary()});
  syncing=false;
  if(res.ok){S.pending=false;persist();setSync('บันทึกคะแนนแล้ว')}
  else if(res.error==='device_locked'||res.error==='not_registered'){showLocked(res.error);return}
  else{S.pending=true;persist();setSync('ยังบันทึกไม่สำเร็จ จะลองใหม่อัตโนมัติ',true)}
  if(syncAgain){syncAgain=false;sync()}
}
function setSync(t,bad){syncState=t;const el=$('#sync');if(el){el.textContent=t;el.classList.toggle('bad',!!bad)}}
setInterval(()=>{if(S&&S.pending&&!syncing)sync()},30000);

/* ---------- anti-cheat (บันทึกการสลับหน้าจอ) ---------- */
let inQuiz=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&inQuiz&&S&&S.user){S.violations=(S.violations||0)+1;persist();S.pending=true}
  else if(!document.hidden&&inQuiz&&S&&S.user){toast('ระบบบันทึกการออกจากหน้าข้อสอบแล้ว ('+S.violations+' ครั้ง)');sync()}
});
try{new MutationObserver(ms=>{if(!inQuiz||!S)return;if(ms.some(m=>m.type==='characterData')){S.violations=(S.violations||0)+1;persist();toast('ห้ามใช้โปรแกรมแปลภาษาระหว่างทำแบบฝึกหัด')}}).observe(document.body,{subtree:true,characterData:true})}catch(e){}

/* =================== screens =================== */
function markHTML(allPass,pass,total){
  const ring=total?`<div class="bigring" style="--p:${Math.round(pass*100/total)}" aria-label="ผ่าน ${pass} จาก ${total} ด่าน"><div><b>${pass}/${total}</b><small>ด่านที่ผ่าน</small></div></div>`:'';
  return `<header class="mark"><div class="grade" aria-hidden="true">0/ร<svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M4 50 L96 12"/></svg>${allPass?'<span class="stamp">ผ่าน</span>':''}</div>
  <div class="htext"><h1>ระบบแก้ 0/ร</h1><p>ฝึกทำแบบฝึกหัดให้ผ่านเกณฑ์ ${PASS_PERCENT}% ครบทุกด่าน</p></div>${ring}</header>`;
}

async function onRegister(e){
  e.preventDefault();
  const first=$('#fn').value.replace(/\s+/g,' ').trim(), last=$('#ln').value.replace(/\s+/g,' ').trim();
  const grade=$('#gr').value, room=$('#rm').value, noRaw=$('#no').value.trim(), no=parseInt(noRaw,10);
  const err=$('#regErr');
  if(!normName(first)) return err.textContent='กรอกชื่อ';
  if(!last) return err.textContent='กรอกนามสกุล';
  if(!grade) return err.textContent='เลือกชั้น';
  if(!room) return err.textContent='เลือกห้อง';
  if(!/^\d+$/.test(noRaw)||no<1||no>MAX_NO) return err.textContent='เลขที่ต้องเป็นตัวเลข 1–'+MAX_NO;
  const user={first,last,grade,room:String(room),no:String(no),key:'M'+grade+'/'+room+'#'+no};
  const btn=$('#regBtn'); btn.disabled=true; btn.textContent='กำลังตรวจสอบ…'; err.textContent='';
  if(GAS_URL){
    const res=await gas({action:'register',key:user.key,firstName:first,lastName:last,grade,room:user.room,no:user.no,deviceId:DEVICE_ID});
    if(!res.ok){btn.disabled=false;btn.textContent='เข้าสู่ระบบฝึก';err.textContent=regError(res);return}
    S={user,topics:{},violations:0,pending:false};
    applyServer(res);
  }else{
    S={user,topics:{},violations:0,pending:false};
  }
  persist(); renderHub();
}
function regError(res){
  switch(res.error){
    case 'device_locked': return 'ชื่อนี้ใช้งานอยู่บนเครื่องอื่นแล้ว ถ้าเป็นเครื่องของเราจริง ให้แจ้งครูเพื่อปลดล็อก';
    case 'device_used': return 'เครื่องนี้ลงทะเบียนเป็น '+(res.owner||'นักเรียนคนอื่น')+' ไปแล้ว ใช้เครื่องนี้เข้าชื่ออื่นไม่ได้ ถ้ากรอกผิดให้แจ้งครู';
    case 'taken': return 'ชั้น ห้อง และเลขที่นี้ลงทะเบียนด้วยชื่ออื่นไว้แล้ว ตรวจเลขที่อีกครั้ง หรือแจ้งครู';
    case 'network': return 'เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';
    default: return 'ลงทะเบียนไม่สำเร็จ ('+(res.error||'unknown')+') ลองอีกครั้ง';
  }
}
function applyServer(res){
  if(res.passPercent) PASS_PERCENT=Number(res.passPercent)||PASS_PERCENT;
  const srv=(res.data&&res.data.topics)||{};
  Object.keys(srv).forEach(id=>{if(!TOPIC_BY_ID[id])return;const t=T(id),s=srv[id]||{};t.best=Math.max(t.best||0,+s.best||0);t.attempts=Math.max(t.attempts||0,+s.attempts||0);if(t.last==null&&s.last!=null)t.last=+s.last});
  if(res.data&&res.data.violations) S.violations=Math.max(S.violations||0,+res.data.violations||0);
}

function renderHub(){
  inQuiz=false;
  const u=S.user, list=TOPICS[u.grade]||[];
  const passCount=list.filter(t=>isPass(T(t.id).best,BANK[t.id].length)).length;
  const allPass=passCount===list.length&&list.length>0;
  app.innerHTML=`${markHTML(allPass,passCount,list.length)}
  <div class="who"><div><b>${esc(u.first)} ${esc(u.last)}</b><br>ม.${esc(u.grade)}/${esc(u.room)} เลขที่ ${esc(u.no)}</div>
    <div style="text-align:right"><b>ผ่านแล้ว ${passCount} จาก ${list.length} ด่าน</b><br><span class="sync${S.pending?' bad':''}" id="sync">${GAS_URL?(S.pending?'มีคะแนนที่ยังไม่ได้ส่ง':esc(syncState||'เชื่อมต่อระบบของครูแล้ว')):'โหมดออฟไลน์ คะแนนอยู่ในเครื่องนี้'}</span></div></div>
  ${allPass?'<div class="note" style="margin-bottom:14px;border-color:var(--pass);background:var(--pass-soft)">ผ่านครบทุกด่านแล้ว แจ้งครูได้เลย หรือจะทำซ้ำเพื่อทบทวนก็ได้</div>':''}
  <div class="ledger">${list.map(topicRow).join('')}</div>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>startTopic(b.dataset.go,b.dataset.mode==='new')));
  if(S.pending) sync();
}
function topicRow(t){
  const st=T(t.id), total=BANK[t.id].length, run=st.run;
  const inProgress=run&&!run.done&&run.answers.length>0;
  const ticks=Array.from({length:total},(_,i)=>{const a=run&&run.answers[i];return `<i class="${a?(a.ok?'y':'n'):''}"></i>`}).join('');
  const passed=isPass(st.best,total);
  const pill=st.attempts?(passed?'<span class="pill ok">ผ่าน</span>':'<span class="pill no">ยังไม่ผ่าน</span>'):(inProgress?'<span class="pill wait">กำลังทำ</span>':'<span class="pill wait">ยังไม่ได้ทำ</span>');
  let btn;
  if(inProgress) btn=`<button class="btn small" data-go="${t.id}">ทำต่อข้อ ${run.answers.length+1}</button>`;
  else if(st.attempts) btn=`<button class="btn small ${passed?'ghost':'pen'}" data-go="${t.id}" data-mode="new">ทำใหม่</button>`;
  else btn=`<button class="btn small" data-go="${t.id}" data-mode="new">เริ่มทำ</button>`;
  const stats=[];
  if(inProgress) stats.push(`<span>กำลังทำ ${run.answers.length}/${total} ถูก ${run.correct}</span>`);
  if(st.attempts) stats.push(`<span>ดีที่สุด ${st.best}/${total}</span><span>ทำไป ${st.attempts} รอบ</span>`);
  if(!stats.length) stats.push(`<span>${total} ข้อ ง่าย กลาง ยากคละกัน</span>`);
  const bp=Math.round((st.best||0)*100/total);
  return `<section class="topic${passed?' passed':''}"><div class="t-head"><div class="tring" style="--p:${st.attempts?bp:0};--c:${passed?'var(--pass)':'var(--pen)'}"><span>${st.attempts?bp+'%':'–'}</span></div><div class="tt"><h3>${esc(t.name)}</h3><p>${esc(t.th)}</p></div>${pill}</div>
    <div class="ticks" aria-hidden="true">${ticks}</div>
    <div class="t-foot"><div class="stats">${stats.join('')}</div>${btn}</div></section>`;
}

function startTopic(id,fresh){
  const st=T(id);
  if(fresh||!st.run||st.run.done){
    const attempt=(st.attempts||0)+1;
    st.run={attempt,order:shuffle(BANK[id].map((_,i)=>i),S.user.key+'|'+id+'|'+attempt),answers:[],correct:0,done:false};
    persist();
  }
  renderQuestion(id);
}

function renderQuestion(id){
  inQuiz=true;
  const st=T(id), run=st.run, topic=TOPIC_BY_ID[id], total=run.order.length, pos=run.answers.length;
  if(pos>=total) return finishTopic(id);
  const {item,opts,sortable}=questionOf(id,run,pos);
  const ticks=Array.from({length:total},(_,i)=>{const a=run.answers[i];return `<i class="${a?(a.ok?'y':'n'):''}"></i>`}).join('');
  app.innerHTML=`<div class="qbar"><button class="btn small ghost" id="back">กลับหน้าหลัก</button><span class="count">ข้อ ${pos+1} / ${total}</span><span class="right">${streakOf(run)>=3?`<span class="streak">🔥 ${streakOf(run)}</span>`:''}<span>ถูก <b>${run.correct}</b></span></span></div>
  <div class="ticks" aria-hidden="true">${ticks}</div>
  <div class="sheet qcard">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="lvl l${item.l}">${LVL[item.l]}</span><span class="muted" style="font-size:14px">${esc(topic.name)}</span></div>
    <p class="q">${fmtQ(item.q)}</p>
    <div class="opts" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${sortable?'':`<span class="k">${LETTERS[i]}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fbBox"></div>
  </div>`;
  $('#back').addEventListener('click',()=>{sync();renderHub()});
  let answered=false;
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(answered) return; answered=true;
    const chosen=opts[+b.dataset.i], ok=chosen===item.a;
    run.answers.push({i:run.order[pos],c:chosen,ok}); if(ok) run.correct++;
    persist();
    app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const v=opts[+x.dataset.i];if(v===item.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    beep(ok);
    const expl=item.n||topic.rule;
    $('#fbBox').innerHTML=`<div class="fb${ok?' good':''}"><b class="${ok?'good-t':'bad-t'}">${ok?'ถูกต้อง':'ยังไม่ถูก คำตอบคือ '+esc(item.a)}</b>${esc(expl)}</div>
      <div class="nextbar"><button class="btn" id="next">${pos+1>=total?'ดูผลคะแนน':'ข้อต่อไป'}</button></div>`;
    const nx=$('#next'); nx.focus({preventScroll:true});
    nx.scrollIntoView({block:'nearest',behavior:'smooth'});
    nx.addEventListener('click',()=>renderQuestion(id));
    if(run.answers.length%5===0&&run.answers.length<total) sync();
  }));
  window.scrollTo(0,0);
}

function streakOf(run){let k=0;for(let i=run.answers.length-1;i>=0&&run.answers[i].ok;i--)k++;return k}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);
  let x=null;try{x=c.getContext('2d')}catch(e){}if(!x){c.remove();return}
  const W=c.width=innerWidth,H=c.height=innerHeight,cols=['#2EE59D','#FFC940','#7C6CFF','#FF4D63','#4D8BFF','#fff'];
  const P=Array.from({length:160},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<150)requestAnimationFrame(f);else c.remove()})();
}
function finishTopic(id){
  inQuiz=false;
  const st=T(id), run=st.run, total=run.order.length, topic=TOPIC_BY_ID[id];
  if(!run.done){
    run.done=true; st.attempts=Math.max(st.attempts||0,run.attempt); st.last=run.correct; st.best=Math.max(st.best||0,run.correct);
    persist(); sync();
  }
  const pct=Math.round(run.correct*100/total), passed=isPass(run.correct,total);
  const wrong=run.answers.filter(a=>!a.ok);
  app.innerHTML=`<div class="sheet">
    <div class="resultTop"><div class="scorering" style="--p:${pct};--c:${passed?'var(--pass)':'var(--pen)'}"><div><div class="score">${run.correct}<small>/${total}</small></div><span class="muted" style="font-size:14px">${pct}%</span></div></div>
    <div><p class="muted" style="margin:0">${esc(topic.name)} รอบที่ ${run.attempt}</p>
    <h2 style="font-size:28px;margin:4px 0 6px;color:${passed?'var(--pass)':'#FF8A9A'}">${passed?'ผ่านเกณฑ์ '+PASS_PERCENT+'% แล้ว':'ยังไม่ถึงเกณฑ์ '+PASS_PERCENT+'%'}</h2>
    <p class="muted" style="margin:0;font-size:15px">${passed?'':'ทำใหม่ได้ไม่จำกัด ระบบเก็บคะแนนที่ดีที่สุดไว้ '}คะแนนดีที่สุดของด่านนี้ ${st.best}/${total}</p></div></div>
    <div class="actions"><button class="btn${passed?' ghost':' pen'}" id="again">ทำด่านนี้ใหม่</button><button class="btn${passed?'':' ghost'}" id="home">กลับหน้าหลัก</button></div>
    ${wrong.length?`<h3 style="margin-top:22px;font-size:18px">ข้อที่ตอบผิด ${wrong.length} ข้อ</h3><div class="review">${wrong.map(a=>{const it=BANK[id][a.i];return `<div class="rv"><div>${fmtQ(it.q)}</div><div>ตอบ <span class="yours">${esc(a.c)}</span> คำตอบที่ถูก <span class="ans">${esc(it.a)}</span></div>${it.n?`<div class="muted">${esc(it.n)}</div>`:''}</div>`}).join('')}</div>`:'<p style="margin-top:18px">ไม่มีข้อผิดเลย</p>'}
  </div>`;
  if(passed&&!run.celebrated){run.celebrated=true;persist();confetti()}
  $('#again').addEventListener('click',()=>startTopic(id,true));
  $('#home').addEventListener('click',renderHub);
  window.scrollTo(0,0);
}

function showLocked(kind){
  inQuiz=false;
  app.innerHTML=`${markHTML(false)}<div class="sheet lock"><h2>เข้าใช้งานจากเครื่องนี้ไม่ได้</h2>
  <p>${kind==='not_registered'?'ไม่พบชื่อนี้ในระบบของครู (ครูอาจลบรายชื่อออก) ให้แจ้งครูก่อนลงทะเบียนใหม่':'ชื่อนี้ถูกผูกกับเครื่องอื่นแล้ว หนึ่งคนใช้ได้หนึ่งเครื่องเท่านั้น ถ้าเครื่องนี้เป็นของเราจริง ให้แจ้งครูเพื่อปลดล็อก แล้วกดลองอีกครั้ง'}</p>
  <div class="actions"><button class="btn" id="retry">ลองอีกครั้ง</button>${kind==='not_registered'?'<button class="btn ghost" id="reReg">ลงทะเบียนใหม่</button>':''}</div></div>`;
  $('#retry').addEventListener('click',boot);
  const rr=$('#reReg'); if(rr) rr.addEventListener('click',()=>{if(!confirm('ลงทะเบียนใหม่? ความคืบหน้าในเครื่องนี้จะถูกล้าง'))return;try{localStorage.removeItem(LS_KEY)}catch(e){}S=null;renderRegister()});
}

let ADMIN_PIN='', adminRows=[], pollT=null;
function renderAdminLogin(msg){
  document.body.classList.add('adm');
  app.innerHTML=`${markHTML(false)}<div class="sheet" style="max-width:420px"><h2 style="font-size:21px;margin-bottom:10px">หน้าครู</h2>
  <form id="pinF" class="form"><div><label for="pin">รหัส PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
  <div class="err">${esc(msg||'')}</div><button class="btn" id="pinBtn">เข้าสู่หน้าครู</button></form></div>`;
  $('#pinF').addEventListener('submit',async e=>{
    e.preventDefault(); const pin=$('#pin').value.trim(); const b=$('#pinBtn'); b.disabled=true;
    if(!GAS_URL){ if(pin===ADMIN_PIN_OFFLINE){ADMIN_PIN=pin;renderAdmin()}else renderAdminLogin('PIN ไม่ถูกต้อง'); return; }
    const r=await gas({action:'checkPin',pin});
    if(r.ok){ADMIN_PIN=pin;if(r.passPercent)PASS_PERCENT=+r.passPercent;renderAdmin()} else renderAdminLogin(r.error==='network'?'เชื่อมต่อระบบไม่ได้':'PIN ไม่ถูกต้อง');
  });
}
function renderAdmin(){
  const f={g:'',r:'',q:''};
  app.innerHTML=`<div class="adm-top"><div><h1 style="font-size:24px">หน้าครู ระบบแก้ 0/ร</h1><span class="muted" style="font-size:14px" id="admInfo"></span></div>
    <div style="display:flex;gap:8px"><button class="btn small ghost" id="csv">ดาวน์โหลด CSV</button><button class="btn small" id="refresh">รีเฟรช</button></div></div>
  ${GAS_URL?'':'<div class="note" style="margin-bottom:12px">ยังไม่ได้ใส่ GAS_URL ในไฟล์ จึงยังไม่มีข้อมูลนักเรียน ดูวิธีตั้งค่าใน Code.gs</div>'}
  <div class="filters"><select id="fg"><option value="">ทุกชั้น</option><option value="4">ม.4</option><option value="5">ม.5</option></select>
  <select id="fr"><option value="">ทุกห้อง</option>${Array.from({length:ROOMS},(_,i)=>`<option>${i+1}</option>`).join('')}</select>
  <input id="fq" placeholder="ค้นหาชื่อหรือเลขที่"></div>
  <div class="tablebox"><table><thead><tr><th>ชั้น</th><th>เลขที่</th><th>ชื่อ นามสกุล</th><th>ด่าน 1</th><th>ด่าน 2</th><th>ด่าน 3</th><th>ด่าน 4</th><th>ด่าน 5</th><th>ผ่าน</th><th>สลับจอ</th><th>เครื่อง</th><th>ล่าสุด</th><th></th></tr></thead><tbody id="tb"><tr><td colspan="13" class="muted">กำลังโหลด…</td></tr></tbody></table></div>
  <p class="muted" style="font-size:13px;margin-top:10px">ช่องคะแนนแสดงคะแนนดีที่สุด / 50 ตัวเล็กด้านล่างคือข้อที่กำลังทำอยู่ ปุ่ม "ปลดล็อกเครื่อง" ใช้เมื่อนักเรียนเปลี่ยนเครื่องหรือล้างข้อมูลเบราว์เซอร์ นักเรียนจะเข้าเครื่องใหม่ได้โดยคะแนนเดิมยังอยู่</p>`;
  const draw=()=>drawAdmin(f);
  $('#fg').onchange=e=>{f.g=e.target.value;draw()}; $('#fr').onchange=e=>{f.r=e.target.value;draw()}; $('#fq').oninput=e=>{f.q=e.target.value.trim().toLowerCase();draw()};
  $('#refresh').onclick=()=>fetchAdmin(draw); $('#csv').onclick=exportCSV;
  $('#tb').addEventListener('click',async e=>{
    const b=e.target.closest('button[data-act]'); if(!b) return;
    const key=b.dataset.key, row=adminRows.find(r=>r.key===key); if(!row) return;
    const nm=row.firstName+' '+row.lastName;
    if(b.dataset.act==='unlock'&&!confirm('ปลดล็อกเครื่องของ '+nm+' ?\nนักเรียนจะเข้าจากเครื่องใหม่ได้ 1 เครื่อง คะแนนเดิมยังอยู่')) return;
    if(b.dataset.act==='delete'&&!confirm('ลบ '+nm+' ออกจากระบบ?\nคะแนนทั้งหมดของคนนี้จะหายไป')) return;
    b.disabled=true;
    const r=await gas({action:b.dataset.act,pin:ADMIN_PIN,key});
    if(r.ok) toast(b.dataset.act==='unlock'?'ปลดล็อกเครื่องแล้ว':'ลบแล้ว'); else {toast('ทำไม่สำเร็จ: '+(r.error||'')); b.disabled=false}
    fetchAdmin(draw);
  });
  fetchAdmin(draw);
  clearInterval(pollT); pollT=setInterval(()=>{if(!document.hidden)fetchAdmin(draw)},6000);
}
let adminBusy=false;
async function fetchAdmin(draw){
  if(!GAS_URL||adminBusy){draw();return}
  adminBusy=true; const r=await gas({action:'list',pin:ADMIN_PIN}); adminBusy=false;
  if(r.ok){adminRows=r.rows||[];if(r.passPercent)PASS_PERCENT=+r.passPercent;$('#admInfo').textContent='นักเรียน '+adminRows.length+' คน อัปเดต '+new Date().toLocaleTimeString('th-TH')}
  else $('#admInfo').textContent='โหลดข้อมูลไม่สำเร็จ ('+(r.error||'')+')';
  draw();
}
function rowTopics(r){const d=r.data||{};return (TOPICS[r.grade]||[]).map(t=>({t,s:(d.topics||{})[t.id]||null}))}
function drawAdmin(f){
  const tb=$('#tb'); if(!tb) return;
  let rows=adminRows.filter(r=>(!f.g||String(r.grade)===f.g)&&(!f.r||String(r.room)===f.r)&&(!f.q||(r.firstName+' '+r.lastName+' '+r.no).toLowerCase().includes(f.q)));
  rows.sort((a,b)=>(a.grade-b.grade)||(a.room-b.room)||(a.no-b.no));
  if(!rows.length){tb.innerHTML=`<tr><td colspan="13" class="muted">ยังไม่มีนักเรียน${adminRows.length?'ตามเงื่อนไขที่เลือก':''}</td></tr>`;return}
  tb.innerHTML=rows.map(r=>{
    const tps=rowTopics(r); let pass=0;
    const cells=tps.map(({t,s})=>{const tot=BANK[t.id].length;if(!s||(!s.attempts&&!s.answered))return `<td class="c"><span class="cell none">—</span></td>`;const ok=isPass(+s.best||0,tot);if(ok)pass++;return `<td class="c"><span class="cell ${s.attempts?(ok?'ok':'no'):'none'}">${s.attempts?(+s.best||0)+'/'+tot:'—'}${s.answered?`<small>กำลังทำ ${s.answered}</small>`:''}</span></td>`}).join('');
    return `<tr><td>ม.${esc(r.grade)}/${esc(r.room)}</td><td>${esc(r.no)}</td><td>${esc(r.firstName)} ${esc(r.lastName)}</td>${cells}
    <td class="c"><b style="color:${pass===tps.length?'var(--pass)':'inherit'}">${pass}/${tps.length}</b></td>
    <td class="c">${+r.violations?`<span class="viol">${esc(r.violations)}</span>`:'0'}</td>
    <td><span class="dev ${r.deviceId?'on':'off'}">${r.deviceId?'ผูกแล้ว':'ปลดล็อกอยู่'}</span></td>
    <td style="font-size:12px">${esc(r.updated||'')}</td>
    <td><button class="btn small ghost" data-act="unlock" data-key="${esc(r.key)}"${r.deviceId?'':' disabled'}>ปลดล็อกเครื่อง</button> <button class="btn small ghost" style="color:var(--pen);border-color:var(--pen)" data-act="delete" data-key="${esc(r.key)}">ลบ</button></td></tr>`;
  }).join('');
}
function exportCSV(){
  const head=['ชั้น','ห้อง','เลขที่','ชื่อ','นามสกุล','ด่าน1','ด่าน2','ด่าน3','ด่าน4','ด่าน5','ผ่าน(ด่าน)','สลับจอ','อัปเดตล่าสุด'];
  const lines=[head];
  adminRows.slice().sort((a,b)=>(a.grade-b.grade)||(a.room-b.room)||(a.no-b.no)).forEach(r=>{
    const tps=rowTopics(r); let pass=0;
    const sc=tps.map(({t,s})=>{if(!s||!s.attempts)return '';if(isPass(+s.best||0,BANK[t.id].length))pass++;return String(+s.best||0)});
    while(sc.length<5) sc.push('');
    lines.push(['ม.'+r.grade,r.room,r.no,r.firstName,r.lastName,...sc,pass,r.violations||0,r.updated||'']);
  });
  const csv='\ufeff'+lines.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='fix0r-scores.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* =================== boot =================== */
async function boot(){
  if(/[?&]admin=1/.test(location.search)) return renderAdminLogin();
  S=load();
  if(!S) return renderRegister();
  if(!TOPICS[S.user.grade]){S=null;return renderRegister()}
  if(GAS_URL){
    app.innerHTML=`${markHTML(false)}<div class="sheet"><p style="margin:0">กำลังตรวจสอบเครื่อง…</p></div>`;
    const u=S.user;
    const res=await gas({action:'verify',key:u.key,firstName:u.first,lastName:u.last,deviceId:DEVICE_ID});
    if(res.ok){applyServer(res);persist()}
    else if(res.error==='not_registered'||res.error==='taken'){return showLocked('not_registered')}
    else if(res.error==='device_locked'){return showLocked('device_locked')}
    else if(res.error!=='network'){toast('ตรวจสอบเครื่องไม่สำเร็จ ('+res.error+')');setSync('ยังเชื่อมต่อระบบของครูไม่ได้',true)}
    else setSync('ออฟไลน์ชั่วคราว จะบันทึกคะแนนเมื่อต่อเน็ตได้',true);
  }
  renderHub();
}
if(!BANK){app.textContent='ไม่พบคลังข้อสอบ'}else boot();
</script>

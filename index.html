<!DOCTYPE html>
<html lang="th" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#080B26">
<title>ระบบแก้ 0/ร</title>
<style>
:root{
  --bg:#080B26; --bg2:#10153C; --bg3:#171D4D;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.2);
  --text:#F1F3FF; --soft:#C9CEEE; --muted:#9BA2CC;
  --ink:#F1F3FF; --ink-soft:#C9CEEE;
  --pen:#FF4D6A; --pen2:#FF8A5C; --pen-soft:rgba(255,77,106,.15);
  --pass:#2EE6A0; --pass2:#7CF5C8; --pass-soft:rgba(46,230,160,.14);
  --gold:#FFC94A; --violet:#7C6CFF; --blue:#4D8DFF; --hl:#FFC94A;
  --tick:rgba(255,255,255,.11);
  --font:"Sarabun","Noto Sans Thai","Leelawadee UI","Thonburi","Segoe UI",system-ui,sans-serif;
  --r-xl:28px; --r-sheet:22px; --r-ctl:14px;
  --shadow:0 30px 70px -30px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--text);font-size:17px;line-height:1.6;background:var(--bg);overflow-x:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
/* aurora: radial gradients (cheap on Chromebooks — no filter:blur) */
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 32% at 18% 12%,rgba(255,77,106,.38),transparent 70%),
    radial-gradient(34% 30% at 85% 18%,rgba(124,108,255,.42),transparent 70%),
    radial-gradient(40% 36% at 70% 92%,rgba(46,230,160,.30),transparent 70%),
    radial-gradient(30% 28% at 8% 85%,rgba(77,141,255,.22),transparent 70%);
  animation:aurora 28s ease-in-out infinite alternate}
@keyframes aurora{50%{transform:translate(3%,-2%) rotate(3deg)}100%{transform:translate(-3%,2%) rotate(-2deg)}}
/* dot grid */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.2px);background-size:26px 26px;
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent 75%);mask-image:linear-gradient(to bottom,#000,transparent 75%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 60px}
.hidden{display:none!important}
h1,h2,h3{line-height:1.2;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* ---------- surfaces ---------- */
.sheet{position:relative;background:linear-gradient(165deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r-sheet);padding:26px 24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.gborder{position:relative}
.gborder::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(120deg,var(--pen),var(--violet),var(--pass),var(--gold),var(--pen));background-size:300% 300%;animation:pan 9s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@keyframes pan{to{background-position:300% 0}}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;color:#fff;border-radius:var(--r-ctl);padding:11px 22px;font-weight:800;min-height:48px;
  background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 12px 26px -12px rgba(124,108,255,.95),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line2);box-shadow:none;color:var(--text)}
.btn.pen{background:linear-gradient(135deg,var(--pen),var(--pen2));box-shadow:0 12px 26px -12px rgba(255,77,106,.95)}
.btn.small{min-height:40px;padding:6px 16px;font-size:15px}
.btn.wide{width:100%}

/* ---------- hero ---------- */
.mark{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:26px;margin:4px 0 18px;padding:28px;border-radius:var(--r-xl);overflow:hidden;
  background:linear-gradient(120deg,rgba(255,77,106,.20),rgba(124,108,255,.16) 48%,rgba(46,230,160,.16)),rgba(16,21,60,.6);box-shadow:var(--shadow)}
.mark::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);transform:translateX(-110%);animation:sheen 3.4s .9s ease-in-out}
@keyframes sheen{to{transform:translateX(110%)}}
.grade{position:relative;font-weight:900;font-size:92px;line-height:1;letter-spacing:-4px;padding:0 6px;
  background:linear-gradient(180deg,#FFB0BC,var(--pen) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 26px rgba(255,77,106,.55))}
.grade svg{position:absolute;left:-2px;top:-6px;width:calc(100% + 4px);height:calc(100% + 12px);overflow:visible}
.grade path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:strike .6s .45s cubic-bezier(.6,0,.3,1) forwards;filter:drop-shadow(0 0 7px rgba(255,255,255,.85))}
@keyframes strike{to{stroke-dashoffset:0}}
.stamp{position:absolute;right:-30px;top:-16px;transform:rotate(-14deg) scale(0);font-size:22px;font-weight:900;padding:2px 12px;border-radius:10px;border:3px solid var(--pass);color:var(--pass);-webkit-text-fill-color:var(--pass);background:rgba(8,11,38,.88);letter-spacing:0;box-shadow:0 0 26px rgba(46,230,160,.65);animation:stampIn .5s 1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{to{transform:rotate(-14deg) scale(1)}}
.htext{min-width:0}
.hello{display:block;font-size:15px;font-weight:700;color:var(--gold);margin-bottom:2px}
.mark h1{font-size:36px;font-weight:900;background:linear-gradient(90deg,#fff,#CFD3FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark p{margin:4px 0 0;color:var(--soft);font-size:15px}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--soft)}
.chip b{color:var(--text)}
.sync{font-weight:600}
.sync.bad{color:#FF9AAE;border-color:rgba(255,77,106,.4)}
.bigring{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:conic-gradient(var(--pass) calc(var(--p)*1%),rgba(255,255,255,.1) 0);box-shadow:0 0 44px rgba(46,230,160,calc(var(--p)*.006))}
.bigring>div{width:98px;height:98px;border-radius:50%;background:var(--bg2);display:grid;place-content:center;line-height:1.1}
.bigring b{font-size:32px;font-weight:900}.bigring small{font-size:12px;color:var(--muted)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.tile small{display:block;font-size:13px;color:var(--muted)}
.tile b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.tile b span{font-size:15px;color:var(--muted);font-weight:700}
.tile.good b{color:var(--pass)} .tile.bad b{color:#FF9AAE} .tile.gold b{color:var(--gold)}
.banner{display:flex;gap:12px;align-items:center;margin-bottom:18px;padding:14px 18px;border-radius:18px;border:1px solid rgba(46,230,160,.45);background:linear-gradient(120deg,rgba(46,230,160,.16),rgba(124,108,255,.1));font-weight:700}
.banner .bi{font-size:28px}

/* ---------- topic cards ---------- */
.ledger{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.topic{--h:#7C6CFF;--h2:#4D8DFF;position:relative;overflow:hidden;border-radius:var(--r-sheet);padding:18px 18px 16px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.02)),var(--bg2);border:1px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s}
.topic::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--h),var(--h2))}
.topic::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 140px at 0 0,color-mix(in srgb,var(--h) 18%,transparent),transparent);opacity:.9}
.topic:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 22px 44px -24px rgba(0,0,0,.9)}
.topic.passed{border-color:rgba(46,230,160,.45);box-shadow:0 0 0 1px rgba(46,230,160,.18),0 22px 50px -26px rgba(46,230,160,.55)}
.t-top{position:relative;z-index:1;display:flex;gap:14px;align-items:center}
.badge{flex:none;width:66px;height:66px;border-radius:18px;display:grid;place-content:center;text-align:center;line-height:1.05;
  background:linear-gradient(145deg,var(--h),var(--h2));box-shadow:0 12px 24px -12px var(--h),inset 0 1px 0 rgba(255,255,255,.35);color:#fff}
.badge small{font-size:11px;font-weight:700;opacity:.85}
.badge b{font-size:16px;font-weight:900;letter-spacing:-.02em}
.tt{flex:1;min-width:0}
.tt h3{font-size:19px;font-weight:800}
.tt p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.pill{flex:none;align-self:flex-start;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid currentColor}
.pill.ok{color:var(--pass);background:var(--pass-soft)}
.pill.no{color:#FF9AAE;background:var(--pen-soft)}
.pill.wait{color:var(--muted)}
.meter{position:relative;z-index:1;height:10px;border-radius:999px;background:rgba(255,255,255,.08);margin:16px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,var(--h),var(--h2));box-shadow:0 0 12px var(--h);transition:width .6s}
.topic.passed .meter i{background:linear-gradient(90deg,var(--pass),var(--pass2));box-shadow:0 0 12px var(--pass)}
.meter .pl{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);border-radius:2px;box-shadow:0 0 6px var(--gold)}
.meter-legend{position:relative;z-index:1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ticks{position:relative;z-index:1;display:grid;grid-template-columns:repeat(50,1fr);gap:2px;margin:10px 0 12px;height:8px}
.ticks i{background:var(--tick);border-radius:3px}
.ticks i.y{background:var(--pass);box-shadow:0 0 5px rgba(46,230,160,.7)} .ticks i.n{background:var(--pen);box-shadow:0 0 5px rgba(255,77,106,.6)}
.t-foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.t-foot .stats span{margin-right:12px}
.topic .btn:not(.ghost):not(.pen){background:linear-gradient(135deg,var(--h),var(--h2));box-shadow:0 12px 24px -12px var(--h)}

/* ---------- register ---------- */
.regwrap{display:grid;gap:18px}
.form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label,.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--soft)}
input,select{width:100%;border:1px solid var(--line2);border-radius:var(--r-ctl);padding:10px 14px;background:rgba(255,255,255,.06);min-height:50px;color:var(--text);transition:border-color .15s,box-shadow .15s,background .15s}
select option{color:#111}
input::placeholder{color:rgba(255,255,255,.35)}
input:focus,select:focus{outline:none;border-color:var(--violet);background:rgba(124,108,255,.1);box-shadow:0 0 0 4px rgba(124,108,255,.25)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:54px;border-radius:var(--r-ctl);border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:900;font-size:18px;color:var(--soft);transition:all .15s}
.seg button:hover{border-color:var(--violet)}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 10px 22px -10px rgba(124,108,255,.95)}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.preview .chip{font-weight:600}
.err{color:#FF9AAE;font-weight:700;min-height:1.4em;font-size:15px}
.note{border:1px solid rgba(255,201,74,.35);background:rgba(255,201,74,.09);padding:12px 16px;border-radius:14px;font-size:15px;color:#FFE4A6}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--soft);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px}
.step b{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--pen),var(--violet))}

/* ---------- quiz ---------- */
.qtop{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin:-22px -16px 12px;padding:14px 16px 10px;
  background:linear-gradient(to bottom,rgba(8,11,38,.94),rgba(8,11,38,.75));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.qmeta{text-align:center;min-width:0}
.qmeta .tname{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-weight:900;font-variant-numeric:tabular-nums;font-size:19px}
.qright{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--soft)}
.qright b{color:var(--pass)}
.streak{font-weight:900;color:var(--gold);background:rgba(255,201,74,.12);border:1px solid rgba(255,201,74,.45);border-radius:999px;padding:1px 10px;animation:pop .35s}
.prog{position:relative;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px;grid-column:1/-1}
.prog i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--h,var(--violet)),var(--h2,var(--blue)));box-shadow:0 0 12px var(--h,var(--violet));transition:width .4s}
.qcard{--h:#7C6CFF;--h2:#4D8DFF;margin-top:4px;animation:rise .35s ease-out;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--h),var(--h2))}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;border-radius:999px;padding:3px 12px}
.lvl::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lvl.l1{background:rgba(77,141,255,.18);color:#9CC0FF}.lvl.l2{background:rgba(255,201,74,.15);color:var(--gold)}.lvl.l3{background:var(--pen-soft);color:#FF9AAE}
.kbd{font-size:12px;color:var(--muted)}
.kbd kbd{font:inherit;font-weight:800;padding:0 6px;border-radius:6px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--soft)}
.q{font-size:23px;font-weight:700;margin:0 0 20px;overflow-wrap:anywhere;line-height:1.45;white-space:pre-line}
.q u{text-decoration:none;background:linear-gradient(transparent 55%,rgba(255,201,74,.55) 0);padding:0 3px;color:#fff}
.passage{position:relative;white-space:pre-line;font-size:16px;line-height:1.75;background:rgba(0,0,0,.25);border:1px solid var(--line);border-left:3px solid var(--h);border-radius:16px;padding:14px 16px;margin:0 0 18px;max-height:46vh;overflow:auto;color:var(--soft)}
.passage .blank{font-weight:800;color:var(--text);white-space:nowrap}
.passage .blank.on{background:rgba(255,201,74,.22);border:1px solid var(--gold);border-radius:6px;padding:0 4px;color:var(--gold);box-shadow:0 0 12px rgba(255,201,74,.35)}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-height:60px;font-size:17px;color:var(--text);transition:transform .15s,border-color .15s,background .15s,opacity .2s}
.opt .k{flex:none;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.09);border:1px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--h,var(--violet));background:rgba(124,108,255,.12);transform:translateX(4px)}
.opt:hover:not(:disabled) .k{background:var(--h,var(--violet));color:#fff;border-color:transparent}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.45}
.opt.right{border-color:var(--pass);background:var(--pass-soft);box-shadow:0 0 0 1px var(--pass),0 0 30px -6px rgba(46,230,160,.75);animation:pop .4s}
.opt.right .k{background:var(--pass);color:#062B1B;border-color:transparent}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft);animation:shake .4s}
.opt.wrong .k{background:var(--pen);color:#fff;border-color:transparent}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{display:flex;gap:14px;align-items:flex-start;margin-top:18px;border-radius:18px;padding:14px 16px;background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.38);animation:rise .3s}
.fb.good{background:rgba(46,230,160,.1);border-color:rgba(46,230,160,.38)}
.fbicon{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;background:var(--pen);box-shadow:0 0 18px rgba(255,77,106,.6)}
.fb.good .fbicon{background:var(--pass);color:#062B1B;box-shadow:0 0 18px rgba(46,230,160,.6)}
.fb b{display:block;margin-bottom:2px;font-size:17px}
.fb p{margin:0;color:var(--soft)}
.fb .good-t{color:var(--pass)} .fb .bad-t{color:#FF9AAE}
.nextbar{margin-top:18px;display:flex;justify-content:flex-end;align-items:center;gap:10px}

/* ---------- result ---------- */
.result{--h:#7C6CFF;--h2:#4D8DFF;overflow:hidden}
.result::before{content:"";position:absolute;inset:0 0 auto;height:160px;background:radial-gradient(60% 100% at 20% 0,color-mix(in srgb,var(--c) 22%,transparent),transparent);pointer-events:none}
.resultTop{position:relative;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.scorering{width:176px;height:176px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0);box-shadow:0 0 60px -10px var(--c)}
.scorering>div{width:146px;height:146px;border-radius:50%;background:var(--bg2);display:grid;place-content:center;text-align:center}
.score{font-size:54px;font-weight:900;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:900;padding:4px 14px;border-radius:999px;margin:6px 0 4px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.result .tiles{grid-template-columns:repeat(4,1fr);margin:22px 0 0}
.lvlbars{display:grid;gap:10px;margin-top:18px}
.lb{display:grid;grid-template-columns:80px 1fr 64px;align-items:center;gap:12px;font-size:14px}
.lb .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.lb .bar i{display:block;height:100%;border-radius:inherit}
.lb.l1 .bar i{background:linear-gradient(90deg,#4D8DFF,#9CC0FF)}.lb.l2 .bar i{background:linear-gradient(90deg,#FFB020,var(--gold))}.lb.l3 .bar i{background:linear-gradient(90deg,var(--pen),var(--pen2))}
.lb span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.review{margin-top:14px;display:grid;gap:10px}
.rv{border:1px solid var(--line);border-left:4px solid var(--pen);background:rgba(255,255,255,.04);padding:12px 14px;border-radius:14px;font-size:15px}
.rv .qtext{white-space:pre-line;margin-bottom:4px}
.rvl{display:flex;gap:10px;align-items:baseline;margin-top:2px}
.rk{flex:none;width:56px;font-size:12px;font-weight:800;color:var(--muted)}
.rvn{margin-top:6px;font-size:14px;color:var(--soft);background:rgba(255,201,74,.07);border-radius:10px;padding:6px 10px}
.rv .yours{color:#FF9AAE;text-decoration:line-through}
.rv .ans{color:var(--pass);font-weight:800}
.rv details{margin-bottom:6px}.rv summary{cursor:pointer;color:var(--muted);font-size:14px}
.rv .passage{max-height:none;margin:8px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sec-h{margin-top:26px;font-size:18px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* ---------- locked ---------- */
.lock h2{color:#FF9AAE;font-size:26px;margin-bottom:8px}

/* ---------- footer ---------- */
.foot{max-width:960px;margin:-30px auto 0;padding:0 16px 34px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.adminlink{display:inline-flex;align-items:center;gap:6px;color:var(--text);text-decoration:none;font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,201,74,.45);background:linear-gradient(135deg,rgba(255,201,74,.16),rgba(124,108,255,.14));box-shadow:0 8px 20px -12px rgba(255,201,74,.8);transition:transform .15s,filter .15s}
.adminlink:hover{transform:translateY(-2px);filter:brightness(1.15)}

/* ---------- admin ---------- */
.adm .wrap{max-width:1220px}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:20px 22px;border-radius:var(--r-xl);background:linear-gradient(120deg,rgba(255,201,74,.14),rgba(124,108,255,.14)),rgba(16,21,60,.6);border:1px solid var(--line)}
.admhello{display:inline-block;margin-top:4px;font-size:14px;color:var(--gold);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{width:auto;min-height:42px;padding:6px 12px}
.tablebox{overflow-x:auto;background:rgba(16,21,60,.7);border:1px solid var(--line);border-radius:var(--r-sheet)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:980px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:rgba(23,29,77,.97);position:sticky;top:0;font-size:13px;color:var(--muted)}
tbody tr:hover{background:rgba(255,255,255,.04)}
td.c{text-align:center}
.cell{display:inline-block;min-width:56px;text-align:center;border-radius:8px;padding:2px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--pass-soft);color:var(--pass)} .cell.no{background:var(--pen-soft);color:#FF9AAE} .cell.none{color:var(--muted);font-weight:400}
.cell small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.dev{font-size:12px} .dev.on{color:var(--pass)} .dev.off{color:var(--muted)}
.viol{color:#FF9AAE;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:rgba(23,29,77,.96);border:1px solid var(--line2);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:50;max-width:92vw;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}

@media (max-width:680px){
  .mark{grid-template-columns:auto 1fr;gap:14px 18px;padding:20px}
  .mark .bigring{grid-column:1/-1;justify-self:start;width:auto;height:auto;border-radius:16px;background:none;box-shadow:none;display:block;width:100%}
  .mark .bigring>div{width:100%;height:auto;border-radius:999px;background:rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding:8px 14px;position:relative;overflow:hidden}
  .mark .bigring>div::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p)*1%);background:linear-gradient(90deg,rgba(46,230,160,.45),rgba(46,230,160,.2))}
  .mark .bigring b,.mark .bigring small{position:relative;font-size:16px}
  .mark{grid-template-columns:1fr;gap:12px}
  .grade{font-size:54px;letter-spacing:-3px;justify-self:start}.mark h1{font-size:27px}
  .hello{font-size:14px}.who{gap:6px;margin-top:10px}.chip{font-size:12px;padding:3px 10px}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px}.tile{padding:10px 12px}.tile small{font-size:12px}.tile b{font-size:22px}.tile b span{display:block;font-size:12px;line-height:1.3}
  .badge{width:58px;height:58px;border-radius:16px}.badge b{font-size:14px}.tt h3{font-size:17px}
  .result .tiles{grid-template-columns:repeat(2,1fr)}
  .ledger{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .q{font-size:19px}
  .sheet{padding:20px 16px}
  .scorering{width:144px;height:144px}.scorering>div{width:118px;height:118px}.score{font-size:42px}
  .kbd{display:none}
}
@media (hover:none){.kbd{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.grade path{stroke-dashoffset:0}.stamp{transform:rotate(-14deg) scale(1)}.mark::after{display:none}}
</style>

const BANK = {"m4-1":[{"l":1,"q":"Which word is an adverb of manner? \"The old man walked slowly to the bus stop.\"","a":"slowly","d":["walked","old","stop"]},{"l":1,"q":"Which word is an adverb of manner? \"The children played happily in the garden.\"","a":"happily","d":["played","children","garden"]},{"l":1,"q":"Which word is an adverb of manner? \"Tom answered the difficult question correctly.\"","a":"correctly","d":["answered","difficult","question"]},{"l":1,"q":"Which word is an adverb of manner? \"My sister dances gracefully on the stage.\"","a":"gracefully","d":["dances","sister","stage"]},{"l":1,"q":"Which word is an adverb of manner? \"The students listened carefully to the teacher.\"","a":"carefully","d":["listened","students","teacher"]},{"l":1,"q":"Which word is an adverb of manner? \"He shouted angrily at the noisy dog.\"","a":"angrily","d":["shouted","noisy","dog"]},{"l":1,"q":"Which word is an adverb of manner? \"Please close the heavy door quietly.\"","a":"quietly","d":["close","heavy","door"]},{"l":1,"q":"Which word is an adverb of manner? \"The girl answered the phone politely.\"","a":"politely","d":["answered","girl","phone"]},{"l":1,"q":"The baby is sleeping ___ in her bed.","a":"peacefully","d":["peaceful","peace","peacefulness"]},{"l":1,"q":"The athlete ran ___ and won the race.","a":"quickly","d":["quick","quickness","quicken"]},{"l":1,"q":"The cat moved ___ towards the bird.","a":"silently","d":["silent","silence","silenced"]},{"l":1,"q":"Adverbs of manner answer which question?","a":"How?","d":["Where?","When?","How often?"]},{"l":1,"q":"What type of adverb is the underlined word? \"She finished her homework *quickly*.\"","a":"Adverb of manner","d":["Adverb of time","Adverb of place","Adverb of frequency"]},{"l":1,"q":"What type of adverb is the underlined word? \"The team played *badly* yesterday.\"","a":"Adverb of manner","d":["Adverb of time","Adverb of degree","Adverb of place"]},{"l":2,"q":"Which word is an adverb (not an adjective)?","a":"loudly","d":["lovely","friendly","lonely"],"n":"lovely, friendly, lonely ลงท้าย -ly ก็จริง แต่เป็น adjective (ขยายคำนาม) เช่น a friendly dog"},{"l":2,"q":"Which word is NOT an adverb of manner?","a":"friendly","d":["slowly","politely","badly"],"n":"friendly เป็น adjective (a friendly teacher) ส่วนคำอื่นเป็น adverb of manner"},{"l":2,"q":"She speaks English very ___.","a":"well","d":["good","goodly","nice"],"n":"good เป็น adjective ส่วน adverb ของ good คือ well → speaks well"},{"l":2,"q":"He is a careful driver. He drives ___.","a":"carefully","d":["careful","care","cared"],"n":"drive เป็นกริยาแท้ ต้องใช้ adverb (careful + ly)"},{"l":2,"q":"They are good singers. They sing ___.","a":"well","d":["good","goodness","goods"],"n":"sing เป็นกริยาแท้ ใช้ adverb → well"},{"l":2,"q":"Lisa is a fast runner. She runs ___.","a":"fast","d":["fastly","fasting","fastness"],"n":"fast เป็นได้ทั้ง adjective และ adverb ไม่มีคำว่า fastly"},{"l":2,"q":"My brother is a hard worker. He works ___.","a":"hard","d":["hardly","hardness","hardship"],"n":"hard เป็น adverb ได้เลย ส่วน hardly แปลว่า \"แทบจะไม่\""},{"l":2,"q":"The test was easy. I finished it ___.","a":"easily","d":["easy","easiness","ease"]},{"l":2,"q":"Change into an adverb: happy →","a":"happily","d":["happyly","happly","happier"],"n":"พยัญชนะ + y → เปลี่ยน y เป็น i แล้วเติม ly"},{"l":2,"q":"Change into an adverb: gentle →","a":"gently","d":["gentlely","gentily","gentler"],"n":"คำที่ลงท้าย -le → ตัด e เติม y"},{"l":2,"q":"Change into an adverb: terrible →","a":"terribly","d":["terriblely","terribley","terribility"],"n":"คำที่ลงท้าย -le → ตัด e เติม y"},{"l":2,"q":"Change into an adverb: automatic →","a":"automatically","d":["automaticly","automaticaly","automatical"],"n":"คำที่ลงท้าย -ic → เติม -ally"},{"l":2,"q":"Change into an adverb: true →","a":"truly","d":["truely","truelly","truthly"],"n":"true เป็นคำยกเว้น ตัด e แล้วเติม ly → truly"},{"l":2,"q":"Change into an adverb: good →","a":"well","d":["goodly","goodily","better"],"n":"good เป็นคำยกเว้น adverb คือ well"},{"l":2,"q":"Which question does the underlined word answer? \"He fixed the bike *skillfully*.\"","a":"How did he fix the bike?","d":["When did he fix the bike?","Where did he fix the bike?","How often did he fix the bike?"]},{"l":2,"q":"Mr. Brown explained the lesson ___, so everyone understood.","a":"clearly","d":["clear","clarity","clearing"]},{"l":2,"q":"The children waited ___ for the bus in the rain.","a":"patiently","d":["patient","patience","patients"]},{"l":2,"q":"The thief entered the house ___, so nobody heard him.","a":"silently","d":["loudly","noisily","heavily"],"n":"ดูจากบริบท \"nobody heard him\" = ไม่มีใครได้ยิน จึงต้องเงียบ"},{"l":2,"q":"She was very tired, so she walked home ___.","a":"slowly","d":["quickly","energetically","fast"],"n":"เหนื่อยมาก จึงเดินช้า ๆ"},{"l":2,"q":"Please drive ___. The road is wet.","a":"carefully","d":["careful","carelessly","care"],"n":"ถนนเปียก ต้องขับอย่างระมัดระวัง carelessly = อย่างประมาท"},{"l":3,"q":"Choose the correct sentence.","a":"He speaks English fluently.","d":["He speaks fluently English.","He speaks English fluent.","Fluently he English speaks."],"n":"adverb of manner ไม่คั่นระหว่างกริยากับกรรม: speaks + English + fluently"},{"l":3,"q":"Choose the correct sentence.","a":"She opened the letter carefully.","d":["She opened carefully the letter.","She opened the letter careful.","Carefully she the letter opened."],"n":"วาง adverb หลังกรรม ไม่คั่นกริยากับกรรม"},{"l":3,"q":"Choose the correct sentence.","a":"The boy did his homework badly.","d":["The boy did badly his homework.","The boy did his homework bad.","The boy did his badly homework."]},{"l":3,"q":"Which sentence is correct?","a":"You look happy today.","d":["You look happily today.","You happily look today.","You look happiness today."],"n":"look (ดูเหมือน) เป็น linking verb ต้องตามด้วย adjective ไม่ใช่ adverb"},{"l":3,"q":"Which sentence is correct?","a":"She looked at me angrily.","d":["She looked at me anger.","She looked angrily me.","She angry looked at me."],"n":"look at (มองดู) เป็นกริยาแสดงการกระทำ ใช้ adverb ขยาย"},{"l":3,"q":"Which sentence uses \"hard\" correctly?","a":"He studied hard for the exam.","d":["He hardly studied hard.","He studied hardness for the exam.","He hard studied for the exam."]},{"l":3,"q":"\"He hardly studied, so he failed the exam.\" What does \"hardly\" mean?","a":"almost not","d":["very hard","quickly","always"],"n":"hardly = แทบจะไม่ (ไม่ใช่ \"อย่างหนัก\")"},{"l":3,"q":"She sang ___ than her sister at the concert.","a":"more beautifully","d":["beautifuller","more beautiful","most beautifully"],"n":"เปรียบเทียบ adverb ยาวใช้ more + adverb + than"},{"l":3,"q":"Of all the students, Ken writes the ___.","a":"most neatly","d":["more neatly","neatliest","most neat"],"n":"ขั้นสูงสุดของ adverb ยาวใช้ the most + adverb"},{"l":3,"q":"Which word can be BOTH an adjective and an adverb of manner?","a":"fast","d":["quickly","happy","careful"]},{"l":3,"q":"Which sentence uses \"late\" as an adverb?","a":"He arrived late.","d":["He was late.","It is a late train.","The late news was bad."],"n":"arrived late → late ขยายกริยา arrived จึงเป็น adverb"},{"l":3,"q":"Which sentence uses \"well\" as an adverb of manner?","a":"She plays the piano well.","d":["I am well, thank you.","The water in the well is clean.","Well, let me think."]},{"l":3,"q":"Find the mistake: \"My father drives very careful in the rain.\"","a":"careful → carefully","d":["drives → drive","very → much","in → on"]},{"l":3,"q":"Find the mistake: \"The team played good in the final match.\"","a":"good → well","d":["played → play","in → at","final → finally"]},{"l":3,"q":"Find the mistake: \"She answered all the questions correct.\"","a":"correct → correctly","d":["answered → answer","all → every","questions → question"]},{"l":3,"q":"Find the mistake: \"The baby smiled happy at her mother.\"","a":"happy → happily","d":["smiled → smile","at → on","her → she"]}],"m4-2":[{"l":1,"q":"Which word is an adverb of frequency? \"I always brush my teeth before bed.\"","a":"always","d":["brush","teeth","bed"]},{"l":1,"q":"Which word is an adverb of frequency? \"Tom usually walks to school.\"","a":"usually","d":["walks","school","Tom"]},{"l":1,"q":"Which word is an adverb of frequency? \"She never eats meat.\"","a":"never","d":["eats","meat","She"]},{"l":1,"q":"Which word is an adverb of frequency? \"We sometimes go to the beach on weekends.\"","a":"sometimes","d":["go","beach","weekends"]},{"l":1,"q":"Which word is an adverb of frequency? \"My dad often reads the newspaper in the morning.\"","a":"often","d":["reads","newspaper","morning"]},{"l":1,"q":"Which word is an adverb of frequency? \"They always eat breakfast at 7 a.m.\"","a":"always","d":["eat","breakfast","7 a.m."]},{"l":1,"q":"Adverbs of frequency answer which question?","a":"How often?","d":["How?","Where?","How much?"]},{"l":1,"q":"Which word means 100% of the time?","a":"always","d":["often","sometimes","never"]},{"l":1,"q":"Which word means 0% of the time?","a":"never","d":["rarely","seldom","sometimes"],"n":"rarely / seldom = นาน ๆ ครั้ง ยังไม่ใช่ 0%"},{"l":1,"q":"Which word means about 50% of the time?","a":"sometimes","d":["always","never","usually"]},{"l":1,"q":"What type of adverb is the underlined word? \"We *seldom* watch TV.\"","a":"Adverb of frequency","d":["Adverb of manner","Adverb of place","Adverb of degree"]},{"l":1,"q":"What type of adverb is the underlined word? \"She *often* goes jogging.\"","a":"Adverb of frequency","d":["Adverb of time","Adverb of manner","Adverb of place"]},{"l":1,"q":"\"Tim never drinks soda.\" How often does Tim drink soda?","a":"0% (never)","d":["100% (always)","about 50%","about 80%"]},{"l":2,"q":"Put these words in order from most to least frequent.","a":"always → usually → sometimes → never","d":["never → sometimes → usually → always","usually → always → never → sometimes","sometimes → always → usually → never"]},{"l":2,"q":"Which word has the SAME meaning as \"rarely\"?","a":"seldom","d":["often","usually","always"]},{"l":2,"q":"Which word has the same meaning as \"frequently\"?","a":"often","d":["never","seldom","rarely"]},{"l":2,"q":"I ___ drink coffee. I don't like it at all.","a":"never","d":["always","usually","often"]},{"l":2,"q":"She ___ gets 100% on her tests. She is the best student in class.","a":"always","d":["never","rarely","seldom"]},{"l":2,"q":"He is ___ late for class. He almost never comes on time.","a":"usually","d":["never","rarely","seldom"],"n":"almost never comes on time = แทบไม่เคยมาตรงเวลา แปลว่ามักจะสาย"},{"l":2,"q":"It ___ snows in Bangkok. It is a hot city.","a":"never","d":["always","often","usually"]},{"l":2,"q":"Where does \"never\" go? \"She (a) is (b) late (c) for work (d).\"","a":"b","d":["a","c","d"],"n":"adverb of frequency วางหลัง verb to be → She is never late."},{"l":2,"q":"Where does \"always\" go? \"I (a) drink (b) milk (c) in the morning (d).\"","a":"a","d":["b","c","d"],"n":"adverb of frequency วางหน้ากริยาแท้ → I always drink milk."},{"l":2,"q":"How often do you exercise? \"I exercise ___ a week.\"","a":"three times","d":["always","never","usually"]},{"l":2,"q":"\"once a week\" means ___","a":"one time every week","d":["every day","two times a week","never"]},{"l":2,"q":"Which word means \"every day\"?","a":"daily","d":["weekly","monthly","yearly"]},{"l":2,"q":"The newspaper comes out every week. It is a ___ newspaper.","a":"weekly","d":["daily","monthly","yearly"]},{"l":2,"q":"Ann goes to the gym every Monday, Tuesday, Wednesday, Thursday and Friday. She ___ goes to the gym on weekdays.","a":"always","d":["never","rarely","sometimes"]},{"l":2,"q":"Ben plays games every day except Sunday. He ___ plays games.","a":"usually","d":["never","always","rarely"]},{"l":2,"q":"Kate has been to the zoo only once in her life. She ___ goes to the zoo.","a":"rarely","d":["often","usually","always"]},{"l":2,"q":"I ___ forget my homework. It happened only one time this year.","a":"hardl e better than AI","The history of homework"],"g":"r9","p":"Should students be allowed to use AI chatbots for homework? Supporters say these tools can explain difficult ideas in simple language and give students feedback at any time of day, something a teacher with forty students cannot always do. Opponents worry that students will simply copy the answers without thinking, and that their writing skills will suffer. Many teachers now take a middle path. They allow AI to be used for brainstorming and checking grammar, but they ask students to write first drafts by hand in class. As one teacher put it, \"A calculator didn't stop us from learning maths. The question is not whether to use the tool, but how.\""},{"l":2,"q":"According to supporters, what is one advantage of AI chatbots?","a":"They are available at any time.","d":["They do homework for students.","They replace teachers completely.","They improve handwriting."],"g":"r9","p":"Should students be allowed to use AI chatbots for homework? Supporters say these tools can explain difficult ideas in simple language and give students feedback at any time of day, something a teacher with forty students cannot always do. Opponents worry that students will simply copy the answers without thinking, and that their writing skills will suffer. Many teachers now take a middle path. They allow AI to be used for brainstorming and checking grammar, but they ask students to write first drafts by hand in class. As one teacher put it, \"A calculator didn't stop us from learning maths. The question is not whether to use the tool, but how.\""},{"l":2,"q":"What do opponents fear?","a":"Students will stop thinking for themselves.","d":["AI will be too expensive for most schools and students to use.","Teachers will lose their jobs.","Students will use calculators too much."],"g":"r9","p":"Should students be allowed to use AI chatbots for homework? Supporters say these tools can explain difficult ideas in simple language and give students function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtQ(s){return esc(s).replace(/\*([^*]+)\*/g,'<u>$1</u>')}
function hash(str){let h1=0xdeadbeef^0,h2=0x41c6ce57^0;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0)*4294967296+(h1>>>0)}
function rng(seedStr){let a=hash(seedStr)%4294967296;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seedStr){const a=arr.slice(),r=rng(seedStr);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normName(s){return String(s||'').trim().replace(/^(นางสาว|นาย|นาง|เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.|ดช\.|ดญ\.)\s*/,'').replace(/\s+/g,' ').trim().toLowerCase()}

let AC=null;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const now=AC.currentTime;const notes=ok?[660,880]:[220,180];notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,now+i*.09);g.gain.exponentialRampToValueAtTime(ok?.18:.08,now+i*.09+.01);g.gain.exponentialRampToValueAtTime(0.0001,now+i*.09+.16);o.connect(g).connect(AC.destination);o.start(now+i*.09);o.stop(now+i*.09+.18)})}catch(e){}}

/* ---------- backend ---------- */
async function gas(payload,timeoutMs){
  if(!GAS_URL) return {ok:false,error:'offline'};
  const ctrl=('AbortController' in window)?new AbortController():null;
  const tm=setTimeout(()=>ctrl&&ctrl.abort(),timeoutMs||20000);
  try{
    const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctrl?ctrl.signal:undefined});
    const j=await r.json(); return j&&typeof j==='object'?j:{ok:false,error:'bad_response'};
  }catch(e){return {ok:false,error:'network'}}
  finally{clearTimeout(tm)}
}

/* ---------- topic state ---------- */
function T(id){S.topics[id]=S.topics[id]||{best:0,attempts:0,last:null,run:null};return S.topics[id]}
function topicSummary(){const out={};Object.keys(S.topics).forEach(id=>{const t=S.topics[id];const r=t.run;out[id]={best:t.best,last:t.last,attempts:t.attempts,answered:r&&!r.done?r.answers.length:0,correct:r&&!r.done?r.correct:0}});return out}
function isPass(best,total){return total>0&&best*100/total>=PASS_PERCENT}
function questionOf(id,run,pos){
  const item=BANK[id][run.order[pos]];
  let opts=[item.a].concat(item.d);
  const sortable=opts.every(o=>/^[a-dA-D0-9]$/.test(o.trim()));
  opts=sortable?opts.slice().sort():shuffle(opts,S.user.key+'|'+id+'|'+run.attempt+'|q'+run.order[pos]);
  return {item,opts,sortable};
}

let syncing=false, syncAgain=false, syncState='';
async function sync(){
  if(!GAS_URL||!S||!S.user) return;
  if(syncing){syncAgain=true;return}
  syncing=true; setSync('กำลังบันทึก…');
  const res=await gas({action:'save',key:S.user.key,deviceId:DEVICE_ID,violations:S.violations||0,topics:topicSummary()});

  if(res.ok){S.pending=false;persist();setSync('บันทึกคะแนนแล้ว')}

}

async function onRegister(e){

function regError(res){
  switch(res.error){
    case 'device_locked': return 'ชื่อนี้ใช้งานอยู่บนเครื่องอื่นแล้ว ถ้าเป็นเครื่องของเราจริง ให้แจ้งครูเพื่อปลดล็อก';
    case 'device_used': return 'เครื่องนี้ลงทะเบียนเป็น '+(res.owner||'นักเรียนคนอื่น')+' ไปแล้ว ใช้เครื่องนี้เข้าชื่ออื่นไม่ได้ ถ้ากรอกผิดให้แจ้งครู';
    case 'name_used': return 'ชื่อและนามสกุลนี้ลงทะเบียนไว้แล้วที่ '+(res.owner||'ห้องอื่น')+' หนึ่งชื่อเข้าได้เครื่องเดียว ถ้าเป็นชื่อเราแต่กรอกห้องหรือเลขที่ผิด ให้แจ้งครู';
    case 'taken': return 'ชั้น ห้อง และเลขที่นี้ลงทะเบียนด้วยชื่ออื่นไว้แล้ว ตรวจเลขที่อีกครั้ง หรือแจ้งครู';
    case 'network': return 'เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';
    default: return 'ลงทะเบียนไม่สำเร็จ ('+(res.error||'unknown')+') ลองอีกครั้ง';
  }
}
function applyServer(res){
  if(res.passPercent) PASS_PERCENT=Number(res.passPercent)||PASS_PERCENT;
  const srv=(res.data&&res.data.topics)||{};
  Object.keys(srv).forEach(id=>{if(!TOPIC_BY_ID[id])return;const t=T(id),s=srv[id]||{};t.best=Math.max(t.best||0,+s.best||0);t.attempts=Math.max(t.attempts||0,+s.attempts||0);if(t.last==null&&s.last!=null)t.last=+s.last});
  if(res.data&&res.data.violations) S.violations=Math.max(S.violations||0,+res.data.violations||0);
}

function buildOrder(id,seed){
  const items=BANK[id];
  if(!items.some(it=>it.g)) return shuffle(items.map((_,i)=>i),seed);
  const groups=[],at={};
  items.forEach((it,i)=>{const k=it.g||('#'+i);if(!(k in at)){at[k]=groups.length;groups.push([])}groups[at[k]].push(i)});
  return shuffle(groups.map((_,i)=>i),seed).flatMap(gi=>groups[gi]);
}
function blankOf(it){const m=/\((\d+)\)/.exec(it.q);return m?+m[1]:0}
function fmtP(p,cur){return esc(p).replace(/\((\d+)\) _{3,}/g,(m,n)=>`<span class="blank${+n===cur?' on':''}">(${n}) ______</span>`)}
function passageHTML(it){return it.p?`<div class="passage" translate="no">${fmtP(it.p,blankOf(it))}</div>`:''}
function startTopic(id,fresh){
  const st=T(id);
  if(fresh||!st.run||st.run.done){
    const attempt=(st.attempts||0)+1;
    st.run={attempt,order:buildOrder(id,S.user.key+'|'+id+'|'+attempt),answers:[],correct:0,done:false};
    persist();
  }
  renderQuestion(id);
}

    const nx=$('#next'); nx.focus({preventScroll:true});

function streakOf(run){let k=0;for(let i=run.answers.length-1;i>=0&&run.answers[i].ok;i--)k++;return k}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);
  let x=null;try{x=c.getContext('2d')}catch(e){}if(!x){c.remove();return}
  const W=c.width=innerWidth,H=c.height=innerHeight,cols=['#2EE6A0','#FFC94A','#7C6CFF','#FF4D6A','#4D8DFF','#fff'];
  const P=Array.from({length:170},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<150)requestAnimationFrame(f);else c.remove()})();
}
function tierOf(pct,passed){
  if(pct>=90) return '🏆 ยอดเยี่ยม';
  if(pct>=75) return '🌟 เก่งมาก';
  if(passed) return '✅ ผ่านเกณฑ์';
  if(pct>=40) return '💪 อีกนิดเดียว';
  return '📘 ทบทวนแล้วลองใหม่';
}

  if(!GAS_URL||adminBusy){draw();return}
  adminBusy=true; const r=await gas({action:'list',pin:ADMIN_PIN}); adminBusy=false;
  if(r.ok){adminRows=r.rows||[];if(r.passPercent)PASS_PERCENT=+r.passPercent;$('#admInfo').textContent='นักเรียน '+adminRows.length+' คน อัปเดต '+new Date().toLocaleTimeString('th-TH')}
  else $('#admInfo').textContent='โหลดข้อมูลไม่สำเร็จ ('+(r.error||'')+')';
  draw();
}
function rowTopics(r){const d=r.data||{};return (TOPICS[r.grade]||[]).map(t=>({t,s:(d.topics||{})[t.id]||null}))}
function drawAdmin(f){
  const tb=$('#tb'); if(!tb) return;
  let rows=adminRows.filter(r=>(!f.g||String(r.grade)===f.g)&&(!f.r||String(r.room)===f.r)&&(!f.q||(r.firstName+' '+r.lastName+' '+r.no).toLowerCase().includes(f.q)));
  rows.sort((a,b)=>(a.grade-b.grade)||(a.room-b.room)||(a.no-b.no));
  if(!rows.length){tb.innerHTML=`<tr><td colspan="13" class="muted">ยังไม่มีนักเรียน${adminRows.length?'ตามเงื่อนไขที่เลือก':''}</td></tr>`;return}
  tb.innerHTML=rows.map(r=>{
    const tps=rowTopics(r); let pass=0;
    const cells=tps.map(({t,s})=>{const tot=BANK[t.id].length;if(!s||(!s.attempts&&!s.answered))return `<td class="c"><span class="cell none">—</span></td>`;const ok=isPass(+s.best||0,tot);if(ok)pass++;return `<td class="c"><span class="cell ${s.attempts?(ok?'ok':'no'):'none'}">${s.attempts?(+s.best||0)+'/'+tot:'—'}${s.answered?`<small>กำลังทำ ${s.answered}</small>`:''}</span></td>`}).join('')+'<td class="c"><span class="cell none"></span></td>'.repeat(Math.max(0,5-tps.length));
    return `<tr><td>ม.${esc(r.grade)}/${esc(r.room)}</td><td>${esc(r.no)}</td><td>${esc(r.firstName)} ${esc(r.lastName)}</td>${cells}
    <td class="c"><b style="color:${pass===tps.length?'var(--pass)':'inherit'}">${pass}/${tps.length}</b></td>
    <td class="c">${+r.violations?`<span class="viol">${esc(r.violations)}</span>`:'0'}</td>
    <td><span class="dev ${r.deviceId?'on':'off'}">${r.deviceId?'ผูกแล้ว':'ปลดล็อกอยู่'}</span></td>
    <td style="font-size:12px">${esc(r.updated||'')}</td>
    <td><button class="btn small ghost" data-act="unlock" data-key="${esc(r.key)}"${r.deviceId?'':' disabled'}>ปลดล็อกเครื่อง</button> <button class="btn small ghost" style="color:var(--pen);border-color:var(--pen)" data-act="delete" data-key="${esc(r.key)}">ลบ</button></td></tr>`;
  }).join('');
}
function exportCSV(){
  const head=['ชั้น','ห้อง','เลขที่','ชื่อ','นามสกุล','ด่าน1','ด่าน2','ด่าน3','ด่าน4','ด่าน5','ผ่าน(ด่าน)','สลับจอ','อัปเดตล่าสุด'];
  const lines=[head];
  adminRows.slice().sort((a,b)=>(a.grade-b.grade)||(a.room-b.room)||(a.no-b.no)).forEach(r=>{
    const tps=rowTopics(r); let pass=0;
    const sc=tps.map(({t,s})=>{if(!s||!s.attempts)return '';if(isPass(+s.best||0,BANK[t.id].length))pass++;return String(+s.best||0)});
    while(sc.length<5) sc.push('');
    lines.push(['ม.'+r.grade,r.room,r.no,r.firstName,r.lastName,...sc,pass,r.violations||0,r.updated||'']);
  });
  const csv='\ufeff'+lines.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='fix0r-scores.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* =================== boot =================== */
async function boot(){
  if(/[?&]admin=1/.test(location.search)){
    let sp='';try{sp=sessionStorage.getItem(PIN_SS)||''}catch(e){}
    if(sp){ if(!GAS_URL){if(sp===ADMIN_PIN_OFFLINE){ADMIN_PIN=sp;document.body.classList.add('adm');return renderAdmin()}}
      else{const r=await gas({action:'checkPin',pin:sp});if(r.ok){ADMIN_PIN=sp;if(r.passPercent)PASS_PERCENT=+r.passPercent;document.body.classList.add('adm');return renderAdmin()}} }
    return renderAdminLogin();
  }
  S=load();
  if(!S) return renderRegister();
  if(!TOPICS[S.user.grade]){S=null;return renderRegister()}
  if(GAS_URL){
    app.innerHTML=`${markHTML(false)}<div class="sheet"><p style="margin:0">กำลังตรวจสอบเครื่อง…</p></div>`;
    const u=S.user;
    const res=await gas({action:'verify',key:u.key,firstName:u.first,lastName:u.last,deviceId:DEVICE_ID});
    if(res.ok){applyServer(res);persist()}
    else if(res.error==='not_registered'||res.error==='taken'){return showLocked('not_registered')}
    else if(res.error==='device_locked'){return showLocked('device_locked')}
    else if(res.error!=='network'){toast('ตรวจสอบเครื่องไม่สำเร็จ ('+res.error+')');setSync('ยังเชื่อมต่อระบบของครูไม่ได้',true)}
    else setSync('ออฟไลน์ชั่วคราว จะบันทึกคะแนนเมื่อต่อเน็ตได้',true);
  }
  renderHub();
}
if(!BANK){app.textContent='ไม่พบคลังข้อสอบ'}else boot();
</script>
